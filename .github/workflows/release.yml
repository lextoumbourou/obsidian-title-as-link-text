name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

env:
  PLUGIN_NAME: obsidian-title-as-link-text

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Package
        run: |
          mkdir ${{ env.PLUGIN_NAME }}
          cp main.js manifest.json ${{ env.PLUGIN_NAME }}/
          zip -r ${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip ${{ env.PLUGIN_NAME }}

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=(main.js manifest.json "${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip")
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            # Release already exists (e.g. created manually): update its assets.
            gh release upload "${{ github.ref_name }}" "${ASSETS[@]}" --clobber
          else
            gh release create "${{ github.ref_name }}" "${ASSETS[@]}" \
              --title "${{ github.ref_name }}" \
              --verify-tag \
              --generate-notes
          fi
